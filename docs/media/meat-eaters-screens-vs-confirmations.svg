<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" font-family="Helvetica, Arial, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#fff"/><text x="16" y="22" font-size="14" font-weight="bold" fill="#222">Grand worlds that kept a lasting meat-eating group</text><text x="16" y="40" fill="#555">Light bars: 8-seed screens, 300,000 ticks. Dark bars: 16 fresh seeds, 500,000 ticks.</text><line x1="290" x2="290" y1="52" y2="292" stroke="#eee"/><text x="290" y="308" text-anchor="middle" fill="#666">0%</text><line x1="353.3333333333333" x2="353.3333333333333" y1="52" y2="292" stroke="#eee"/><text x="353.3333333333333" y="308" text-anchor="middle" fill="#666">10%</text><line x1="416.66666666666663" x2="416.66666666666663" y1="52" y2="292" stroke="#eee"/><text x="416.66666666666663" y="308" text-anchor="middle" fill="#666">20%</text><line x1="480" x2="480" y1="52" y2="292" stroke="#eee"/><text x="480" y="308" text-anchor="middle" fill="#666">30%</text><line x1="543.3333333333333" x2="543.3333333333333" y1="52" y2="292" stroke="#eee"/><text x="543.3333333333333" y="308" text-anchor="middle" fill="#666">40%</text><line x1="606.6666666666667" x2="606.6666666666667" y1="52" y2="292" stroke="#eee"/><text x="606.6666666666667" y="308" text-anchor="middle" fill="#666">50%</text><line x1="670" x2="670" y1="52" y2="292" stroke="#eee"/><text x="670" y="308" text-anchor="middle" fill="#666">60%</text><text x="282" y="71" text-anchor="end" fill="#333">Gut + prey condition (+ rest), screen 1</text><rect x="290" y="58" width="79.16666666666669" height="18" fill="#9bb8d3"/><text x="375.1666666666667" y="71" fill="#333">1 of 8</text><text x="282" y="101" text-anchor="end" fill="#333">Gut + prey condition, screen 2</text><rect x="290" y="88" width="158.33333333333337" height="18" fill="#9bb8d3"/><text x="454.33333333333337" y="101" fill="#333">2 of 8</text><text x="282" y="131" text-anchor="end" fill="#333">Gut + prey condition, screen 3</text><rect x="290" y="118" width="316.66666666666674" height="18" fill="#9bb8d3"/><text x="612.6666666666667" y="131" fill="#333">4 of 8</text><text x="282" y="161" text-anchor="end" fill="#333">Gut + prey condition, screen 4</text><rect x="290" y="148" width="1.5" height="18" fill="#9bb8d3"/><text x="296" y="161" fill="#333">0 of 8</text><text x="282" y="191" text-anchor="end" fill="#333">Gut + prey condition, confirmation</text><rect x="290" y="178" width="39.583333333333314" height="18" fill="#1f6fb2"/><text x="335.5833333333333" y="191" fill="#333">1 of 16</text><text x="282" y="221" text-anchor="end" fill="#333">+ young move away, screen 4</text><rect x="290" y="208" width="158.33333333333337" height="18" fill="#9bb8d3"/><text x="454.33333333333337" y="221" fill="#333">2 of 8</text><text x="282" y="251" text-anchor="end" fill="#333">+ young move away, confirmation</text><rect x="290" y="238" width="1.5" height="18" fill="#1f6fb2"/><text x="296" y="251" fill="#333">0 of 16</text><text x="282" y="281" text-anchor="end" fill="#333">Grand world as it is, all six tests</text><rect x="290" y="268" width="1.5" height="18" fill="#7a7a7a"/><text x="296" y="281" fill="#333">0 of 64</text><text x="480" y="332" text-anchor="middle" fill="#444">share of worlds (10 or more meat eaters through most of the second half)</text></svg>
